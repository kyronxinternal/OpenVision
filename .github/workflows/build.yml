name: Build OpenVision

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Swift 6.3 toolchain (Xcode 26.6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Verify toolchain and install build tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

          SWIFT_VERSION="$(swift --version | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -1)"
          if [[ ! "$SWIFT_VERSION" =~ ^6\.([3-9]|[1-9][0-9]) ]]; then
            echo "::error::OpenVision's vendored packages require Swift 6.3 or newer; found $SWIFT_VERSION."
            exit 1
          fi

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Ensure Metal toolchain is available
        shell: bash
        run: |
          set -euo pipefail
          if ! xcrun --find metal >/dev/null 2>&1; then
            echo "Metal compiler is missing; downloading the Xcode Metal toolchain..."
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --find metal
          xcrun --find metallib

      - name: Validate secrets and create configuration
        shell: bash
        env:
          OV_DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          OV_META_APP_ID: ${{ secrets.META_APP_ID }}
          OV_CLIENT_TOKEN: ${{ secrets.CLIENT_TOKEN }}
        run: |
          set -euo pipefail

          missing=0
          for name in OV_DEVELOPMENT_TEAM OV_META_APP_ID OV_CLIENT_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: ${name#OV_}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          if [[ ! "$OV_DEVELOPMENT_TEAM" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::DEVELOPMENT_TEAM must be the 10-character Apple Team ID."
            exit 1
          fi

          SAFE_ACTOR="$(printf '%s' "$GITHUB_ACTOR" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')"
          if [[ -z "$SAFE_ACTOR" ]]; then
            echo "::error::Could not derive a valid bundle identifier from the GitHub actor."
            exit 1
          fi

          printf '%s\n' \
            "DEVELOPMENT_TEAM = $OV_DEVELOPMENT_TEAM" \
            "PRODUCT_BUNDLE_IDENTIFIER = com.$SAFE_ACTOR.openvision" \
            "META_APP_ID = $OV_META_APP_ID" \
            "CLIENT_TOKEN = $OV_CLIENT_TOKEN" \
            "APP_LINK_URL_SCHEME = openvision" \
            > Config.xcconfig

          cp OpenVision/Config/Config.swift.example OpenVision/Config/Config.swift
          echo "Using bundle identifier: com.$SAFE_ACTOR.openvision"

      - name: Generate and validate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint OpenVision/Resources/Info.plist
          plutil -lint OpenVision/OpenVision.entitlements
          xcodegen generate
          test -f OpenVision.xcodeproj/project.pbxproj
          xcodebuild -project OpenVision.xcodeproj -scheme OpenVision -showBuildSettings >/dev/null

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/SourcePackages

          for attempt in 1 2 3; do
            echo "Package resolution attempt $attempt of 3"
            if xcodebuild \
              -resolvePackageDependencies \
              -project OpenVision.xcodeproj \
              -scheme OpenVision \
              -clonedSourcePackagesDirPath build/SourcePackages \
              -skipMacroValidation \
              -skipPackagePluginValidation; then
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              echo "Resolution failed; retrying after a short delay..."
              sleep 10
            fi
          done

          echo "::error::Swift package resolution failed after three attempts."
          exit 1

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          xcodebuild \
            -project OpenVision.xcodeproj \
            -scheme OpenVision \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package and validate unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/OpenVision.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::Build completed but OpenVision.app was not found at $APP_PATH."
            find build/DerivedData/Build/Products -maxdepth 3 -type d -name "*.app" -print || true
            exit 1
          fi

          rm -rf "$APP_PATH/_CodeSignature"
          rm -f "$APP_PATH/embedded.mobileprovision"

          mkdir -p build/package/Payload
          ditto "$APP_PATH" build/package/Payload/OpenVision.app
          (
            cd build/package
            zip -qry ../OpenVision-unsigned.ipa Payload
          )

          unzip -t build/OpenVision-unsigned.ipa
          test -f build/package/Payload/OpenVision.app/OpenVision
          ls -lh build/OpenVision-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenVision-IPA
          path: build/OpenVision-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
